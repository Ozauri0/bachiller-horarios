services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horarios-backend
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - red-internet

  frontend:
    build:
      context: ./new-front
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:5000
        NEXT_PUBLIC_API_BASE: http://backend:5000
    container_name: horarios-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:5000
      - BACKEND_URL=http://backend:5000
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - red-internet

networks:
  red-internet:
    external: true
